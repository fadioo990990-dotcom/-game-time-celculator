


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="manifest.json">
<title>حساب الألعاب والأوردرات</title>

<style>
*{box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#101827;
color:white;
margin:0;
padding:12px;
}
h1{text-align:center;color:#38d9a9}
h2{color:#38d9a9;font-size:19px}
.box{
background:#1e293b;
padding:14px;
border-radius:14px;
margin:12px 0;
}
input,select,button{
width:100%;
padding:12px;
margin:6px 0;
border:0;
border-radius:8px;
font-size:16px;
}
input,select{
background:#f1f5f9;
color:#111827;
}
button{
background:#38d9a9;
color:#102027;
font-weight:bold;
cursor:pointer;
}
.red{background:#ef4444;color:white}
.blue{background:#3b82f6;color:white}
.item{
background:#334155;
padding:11px;
border-radius:9px;
margin:8px 0;
}
.small{font-size:13px;color:#cbd5e1}
.total{
font-size:21px;
color:#38d9a9;
font-weight:bold;
}
.game-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}
.game-btn{
min-height:82px;
font-size:17px;
}
.hidden{display:none}
hr{
border:0;
border-top:1px solid #64748b;
margin:12px 0;
}
.active-title{
color:#38d9a9;
font-size:18px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>🎮 حساب الألعاب والأوردرات</h1>

<div class="box">
<h2>🎮 الألعاب</h2>
<div class="game-grid">
<button class="game-btn" onclick="openGame('billiards1')">🎱<br>بلياردو 1</button>
<button class="game-btn" onclick="openGame('billiards2')">🎱<br>بلياردو 2</button>
<button class="game-btn" onclick="openGame('car')">🚗<br>السيارات</button>
<button class="game-btn" onclick="openGame('hockey')">🏒<br>هوكي</button>
<button class="game-btn" onclick="openGame('ps1')">🎮<br>بلايستيشن 1</button>
<button class="game-btn" onclick="openGame('ps2')">🎮<br>بلايستيشن 2</button>
<button class="game-btn" onclick="openGame('ps3')">🎮<br>بلايستيشن 3</button>
<button class="game-btn" onclick="openGame('ps4')">🎮<br>بلايستيشن 4</button>
</div>
</div>

<div class="box hidden" id="gamePanel">
<h2 id="gameTitle">اللعبة</h2>
<label>اسم الزبون</label>
<input id="gameCustomer" placeholder="اسم الزبون">
<button onclick="startGameSession()">▶️ بدء اللعب</button>
<button class="red" onclick="closeGame()">إغلاق</button>
</div>

<div class="box">
<h2>⏱️ الألعاب النشطة حالياً</h2>
<div id="activeSessionsArea">لا توجد جلسات نشطة</div>
</div>

<div class="box">
<h2>⚙️ الضبط</h2>
<div class="game-grid">
<button onclick="showSettings('gamePrices')">🎮 أسعار الألعاب</button>
<button onclick="showSettings('drinkSettings')">🥤 إدارة المشروبات</button>
<button onclick="showSettings('reportsSettings')">📊 الحساب اليومي والشهري</button>
<button onclick="showSettings('invoicesSettings')">🧾 الفواتير المحفوظة</button>
</div>

<div id="gamePrices" class="hidden">
<hr>
<h2>تعديل أسعار الألعاب</h2>
<div id="pricesArea"></div>
<button onclick="savePrices()">حفظ الأسعار</button>
</div>

<div id="drinkSettings" class="hidden">
<hr>
<h2>إدارة المشروبات</h2>
<div id="drinksArea"></div>
<hr>
<h2>إضافة مشروب جديد</h2>
<input id="newDrinkName" placeholder="اسم المشروب">
<input id="newDrinkPrice" type="number" min="0" placeholder="السعر">
<button onclick="addNewDrink()">إضافة مشروب جديد</button>
</div>

<div id="reportsSettings" class="hidden">
<hr>
<h2>📊 الحساب اليومي</h2>
<label>اختر اليوم</label>
<input type="date" id="reportDate" onchange="renderReports()">
<div class="total" id="dailyTotal">0</div>
<div class="small">إجمالي إيرادات اليوم المختار</div>

<hr>

<h2>📅 الحساب الشهري</h2>
<label>اختر الشهر</label>
<input type="month" id="reportMonth" onchange="renderReports()">
<div class="total" id="monthlyTotal">0</div>
<div class="small">إجمالي إيرادات الشهر المختار</div>
</div>

<div id="invoicesSettings" class="hidden">
<hr>
<h2>🧾 الفواتير المحفوظة</h2>
<div id="invoicesList">لا توجد فواتير محفوظة</div>
</div>
</div>


<script>
const gameNames={
billiards1:"بلياردو 1",
billiards2:"بلياردو 2",
car:"السيارات",
hockey:"هوكي",
ps1:"بلايستيشن 1",
ps2:"بلايستيشن 2",
ps3:"بلايستيشن 3",
ps4:"بلايستيشن 4"
};

function readData(key,fallback){
try{
let value=localStorage.getItem(key);
return value===null?fallback:JSON.parse(value);
}catch(e){
return fallback;
}
}

let prices=readData("prices",{
billiards1:5000,billiards2:5000,car:5000,
football:5000,hockey:5000,
ps1:5000,ps2:5000,ps3:5000,ps4:5000
});

let drinks=readData("drinks",[
{name:"شاي",price:2000},
{name:"قهوة",price:3000},
{name:"نسكافيه",price:4000},
{name:"ماء",price:1000},
{name:"عصير",price:3000}
]);

let invoices=readData("invoices",[]);
let activeSessions=readData("activeSessions",{});
let currentGame="";

if(!Array.isArray(drinks))drinks=[];
if(!Array.isArray(invoices))invoices=[];
if(!activeSessions||typeof activeSessions!=="object")activeSessions={};

for(let key in activeSessions){
let s=activeSessions[key];
if(s&&!Array.isArray(s.drinks))s.drinks=[];
if(s&&!s.pricePerHour)s.pricePerHour=Number(prices[key])||0;
}

function persist(){
localStorage.setItem("prices",JSON.stringify(prices));
localStorage.setItem("drinks",JSON.stringify(drinks));
localStorage.setItem("invoices",JSON.stringify(invoices));
localStorage.setItem("activeSessions",JSON.stringify(activeSessions));
}

function money(n){
return Math.round(Number(n)||0).toLocaleString("en-US");
}

function escapeHtml(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

function today(){
let d=new Date();
return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");
}

function currentMonth(){
return today().slice(0,7);
}

function openGame(key){

if(!gameNames[key]){
alert("اللعبة غير موجودة");
return;
}

currentGame=key;

let panel=document.getElementById("gamePanel");

panel.classList.remove("hidden");
panel.style.display="block";

document.getElementById("gameTitle").textContent=gameNames[key];
document.getElementById("gameCustomer").value="";

panel.scrollIntoView({behavior:"smooth",block:"center"});

}

function closeGame(){
document.getElementById("gamePanel").classList.add("hidden");
currentGame="";
}

function startGameSession(){
if(!currentGame){
alert("اختر اللعبة أولاً");
return;
}
if(activeSessions[currentGame]){
alert("هذه اللعبة تعمل بالفعل");
return;
}

let customer=document.getElementById("gameCustomer").value.trim();

activeSessions[currentGame]={
key:currentGame,
customer:customer,
startTime:Date.now(),
pricePerHour:Number(prices[currentGame])||0,
drinks:[]
};

persist();
renderActiveSessions();
closeGame();
}

function formatDuration(ms){
let sec=Math.max(0,Math.floor(ms/1000));
let h=Math.floor(sec/3600);
let m=Math.floor((sec%3600)/60);
let s=sec%60;
return h+" ساعة و "+m+" دقيقة و "+s+" ثانية";
}

function gameAmount(session,atTime){
let elapsed=Math.max(0,atTime-session.startTime);
return Math.ceil((Number(session.pricePerHour)||0)*elapsed/3600000);
}

function drinksAmount(session){
if(!Array.isArray(session.drinks))session.drinks=[];
return session.drinks.reduce((sum,d)=>sum+(Number(d.amount)||0),0);
}

function renderActiveSessions(){
let html="";

for(let key in activeSessions){
let s=activeSessions[key];
if(!s)continue;
if(!Array.isArray(s.drinks))s.drinks=[];

let elapsed=Date.now()-s.startTime;
let gameTotal=gameAmount(s,Date.now());
let drinkTotal=drinksAmount(s);
let options=drinks.map((d,i)=>
`<option value="${i}">${escapeHtml(d.name)} - ${money(d.price)}</option>`
).join("");

let drinkRows=s.drinks.map((d,i)=>`
<div class="item">
<strong>${escapeHtml(d.name)}</strong>
<div class="small">الكمية: ${d.quantity}</div>
<div>السعر: ${money(d.amount)}</div>
<button class="red" onclick="removeSessionDrink('${key}',${i})">حذف المشروب</button>
</div>
`).join("");

html+=`
<div class="item">
<div class="active-title">${escapeHtml(gameNames[key]||key)}</div>
<div>الزبون: ${escapeHtml(s.customer||"بدون اسم")}</div>
<div class="small">وقت البداية: ${new Date(s.startTime).toLocaleTimeString("ar")}</div>
<div class="small">الوقت المنقضي: ${formatDuration(elapsed)}</div>
<div class="small">سعر الساعة: ${money(s.pricePerHour)}</div>
<hr>
<strong>🥤 مشروبات هذا الحساب</strong>
${drinks.length?`
<select id="drink_${key}">${options}</select>
<input type="number" id="qty_${key}" value="1" min="1">
<button onclick="addDrinkToSession('${key}')">إضافة مشروب لهذا الحساب</button>
`:"لا توجد مشروبات معرفة حالياً"}
${drinkRows}
<hr>
<div>حساب اللعب: ${money(gameTotal)}</div>
<div>مجموع المشروبات: ${money(drinkTotal)}</div>
<div class="total">المجموع الحالي: ${money(gameTotal+drinkTotal)}</div>
<button class="red" onclick="endGameSession('${key}')">إنهاء اللعب وحفظ الفاتورة</button>
</div>`;
}

document.getElementById("activeSessionsArea").innerHTML=html||"لا توجد جلسات نشطة";
}

function addDrinkToSession(key){
let s=activeSessions[key];
if(!s)return;

let select=document.getElementById("drink_"+key);
let qty=Number(document.getElementById("qty_"+key).value);
let d=drinks[Number(select.value)];

if(!d){
alert("اختر مشروباً");
return;
}
if(!Number.isInteger(qty)||qty<1){
alert("أدخل كمية صحيحة");
return;
}

if(!Array.isArray(s.drinks))s.drinks=[];

s.drinks.push({
name:d.name,
price:Number(d.price)||0,
quantity:qty,
amount:(Number(d.price)||0)*qty
});

persist();
renderActiveSessions();
}

function removeSessionDrink(key,index){
let s=activeSessions[key];
if(!s||!Array.isArray(s.drinks))return;
s.drinks.splice(index,1);
persist();
renderActiveSessions();
}

function endGameSession(key){
let s=activeSessions[key];
if(!s)return;

if(!confirm("هل تريد إنهاء اللعب وحفظ فاتورة هذا الزبون؟"))return;

let endTime=Date.now();
let elapsed=Math.max(0,endTime-s.startTime);
let minutes=Math.ceil(elapsed/60000);
let gameTotal=gameAmount(s,endTime);

let invoiceItems=[{
type:"game",
name:gameNames[key]||key,
quantity:1,
amount:gameTotal,
minutes:minutes,
start:new Date(s.startTime).toLocaleTimeString("ar"),
end:new Date(endTime).toLocaleTimeString("ar")
}];

(s.drinks||[]).forEach(d=>{
invoiceItems.push({
type:"drink",
name:d.name,
quantity:d.quantity,
amount:d.amount
});
});

let total=invoiceItems.reduce((sum,x)=>sum+(Number(x.amount)||0),0);

invoices.push({
id:Date.now(),
date:today(),
time:new Date().toLocaleTimeString("ar"),
customer:s.customer||"بدون اسم",
game:gameNames[key]||key,
items:invoiceItems,
total:total
});

delete activeSessions[key];

persist();
renderActiveSessions();
renderInvoices();
renderReports();

alert("تم إنهاء اللعب وحفظ فاتورة الزبون بنجاح");
}

function showSettings(id){
["gamePrices","drinkSettings","reportsSettings","invoicesSettings"].forEach(x=>{
document.getElementById(x).classList.add("hidden");
});
document.getElementById(id).classList.remove("hidden");
if(id==="invoicesSettings")renderInvoices();
if(id==="reportsSettings")renderReports();
}

function renderPrices(){
let html="";
for(let key in gameNames){
html+=`
<label>${gameNames[key]} - سعر الساعة</label>
<input type="number" id="price_${key}" min="0" value="${Number(prices[key])||0}">
`;
}
document.getElementById("pricesArea").innerHTML=html;
}

function savePrices(){
for(let key in gameNames){
let input=document.getElementById("price_"+key);
let value=Number(input.value);
if(!Number.isFinite(value)||value<0){
alert("تأكد من إدخال أسعار صحيحة");
return;
}
prices[key]=value;
}
persist();
alert("تم حفظ الأسعار");
}

function renderDrinks(){
let html="";
drinks.forEach((d,i)=>{
html+=`
<div class="item">
<strong>${escapeHtml(d.name)}</strong>
<label>السعر</label>
<input type="number" id="drinkPrice_${i}" min="0" value="${Number(d.price)||0}">
<button class="blue" onclick="updateDrink(${i})">حفظ تعديل السعر</button>
<button class="red" onclick="deleteDrink(${i})">حذف المشروب</button>
</div>`;
});
document.getElementById("drinksArea").innerHTML=html||"لا توجد مشروبات";
}

function updateDrink(i){
let value=Number(document.getElementById("drinkPrice_"+i).value);
if(!Number.isFinite(value)||value<0){
alert("أدخل سعراً صحيحاً");
return;
}
drinks[i].price=value;
persist();
renderDrinks();
renderActiveSessions();
alert("تم تعديل السعر");
}

function deleteDrink(i){
if(!confirm("هل تريد حذف هذا المشروب؟"))return;
drinks.splice(i,1);
persist();
renderDrinks();
renderActiveSessions();
}

function addNewDrink(){
let name=document.getElementById("newDrinkName").value.trim();
let raw=document.getElementById("newDrinkPrice").value;
let price=Number(raw);

if(!name||raw===""||!Number.isFinite(price)||price<0){
alert("أدخل اسم المشروب والسعر بشكل صحيح");
return;
}

drinks.push({name:name,price:price});
document.getElementById("newDrinkName").value="";
document.getElementById("newDrinkPrice").value="";
persist();
renderDrinks();
alert("تمت إضافة المشروب");
}

function renderReports(){
let dateInput=document.getElementById("reportDate");
let monthInput=document.getElementById("reportMonth");

let date=dateInput.value||today();
let month=monthInput.value||currentMonth();

let daily=invoices.filter(x=>x.date===date);
let monthly=invoices.filter(x=>String(x.date||"").slice(0,7)===month);

let dTotal=daily.reduce((sum,x)=>sum+(Number(x.total)||0),0);
let mTotal=monthly.reduce((sum,x)=>sum+(Number(x.total)||0),0);

document.getElementById("dailyTotal").textContent=money(dTotal);
document.getElementById("monthlyTotal").textContent=money(mTotal);
}

function renderInvoices(){
let html="";

invoices.slice().reverse().forEach(inv=>{
let details=(inv.items||[]).map(item=>{
let extra=item.type==="game"
?`المدة: ${item.minutes||0} دقيقة (${item.start||""} - ${item.end||""})`
:`الكمية: ${item.quantity||1}`;
return `
<div class="item">
<strong>${escapeHtml(item.name)}</strong>
<div class="small">${extra}</div>
<div>المبلغ: ${money(item.amount)}</div>
</div>`;
}).join("");

html+=`
<div class="item">
<strong>فاتورة رقم ${inv.id}</strong>
<div>الزبون: ${escapeHtml(inv.customer||"غير مسجل")}</div>
<div>اللعبة: ${escapeHtml(inv.game||"فاتورة قديمة")}</div>
<div class="small">${escapeHtml(inv.date||"")} - ${escapeHtml(inv.time||"")}</div>
${details}
<div class="total">المجموع: ${money(inv.total)}</div>
<button class="red" onclick="deleteInvoice(${Number(inv.id)})">حذف الفاتورة</button>
</div>`;
});

document.getElementById("invoicesList").innerHTML=html||"لا توجد فواتير محفوظة";
}

function deleteInvoice(id){
if(!confirm("هل تريد حذف هذه الفاتورة؟"))return;
invoices=invoices.filter(x=>Number(x.id)!==Number(id));
persist();
renderInvoices();
renderReports();
}

function render(){
document.getElementById("reportDate").value=today();
document.getElementById("reportMonth").value=currentMonth();
renderPrices();
renderDrinks();
renderInvoices();
renderReports();
renderActiveSessions();
}

persist();
render();

setInterval(renderActiveSessions,1000);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function(error) {
      console.log("Service Worker:", error);
    });
  });
}
</script>

</body>
</html>
